{% set name = "twine" %}
{% set version = "7.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 85cdb29c518efef867360ae4acd4b0dfd61c8654a22fca08e6f8539f05022177

build:
  skip: true  # [py<310]
  entry_points:
    - twine = twine.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.3
    - setuptools_scm >=6.0
    - toml
  run:
    - python
    - readme_renderer >=35.0
    - requests >=2.20
    - requests-toolbelt >=0.8.0,!=0.9.0
    - urllib3 >=1.26.0
    - keyring >=21.2.0
    - rfc3986 >=1.4.0
    - rich >=14.3.3
    - packaging >=26.1
    - id
  run_constrained:
    - keyring >=21.2.0

test:
  source_files:
    - twine
    - tests
  imports:
    - twine
    - twine.commands
  requires:
    - pip
    - pretend
    - pytest
  commands:
    - pip check
    - twine --help
    # Ignore integration tests:
    #  def pypiserver_instance(request, port_getter, watcher_getter, tmp_path_factory):
    #E fixture 'port_getter' not found
    # Ignore test_check.py:
    # E  AssertionError: assert [('twine.comm...transition.')] == [('twine.comm...transition.')]
    - pytest -vv tests --ignore-glob '*integration*.py' --ignore=tests/test_check.py

about:
  home: https://github.com/pypa/twine
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Collection of utilities for interacting with PyPI
  description: |
    Twine is a utility for publishing Python packages on PyPI.
    It provides build system independent uploads of source and
    binary distribution artifacts for both new and existing projects.
  dev_url: https://github.com/pypa/twine
  doc_url: https://twine.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - bollwyvl
